name: Deploy YOLOv8 to OpenStack

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Validate Python App
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Test YOLO import
        run: python -c "from ultralytics import YOLO; print('YOLO imported successfully')"

      - name: Run tests if present
        run: |
          if [ -d tests ]; then
            pytest tests/ -v
          else
            echo "No tests directory found, skipping pytest."
          fi

  deploy-to-devstack:
    name: Deploy to DevStack
    needs: test
    runs-on: self-hosted
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    outputs:
      instance_name: ${{ steps.deploy.outputs.instance_name }}
      floating_ip: ${{ steps.deploy.outputs.floating_ip }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install OpenStack client
        run: |
          # Use apt for system-wide installation on self-hosted runner
          sudo apt update
          sudo apt install -y python3-openstackclient

      - name: Validate required secrets
        env:
          OS_AUTH_URL: ${{ secrets.OS_AUTH_URL }}
          OS_USERNAME: ${{ secrets.OS_USERNAME }}
          OS_PASSWORD: ${{ secrets.OS_PASSWORD }}
          OS_PROJECT_NAME: ${{ secrets.OS_PROJECT_NAME }}
          OS_USER_DOMAIN_NAME: ${{ secrets.OS_USER_DOMAIN_NAME }}
          OS_PROJECT_DOMAIN_NAME: ${{ secrets.OS_PROJECT_DOMAIN_NAME }}
        run: |
          missing=0
          for var in OS_AUTH_URL OS_USERNAME OS_PASSWORD OS_PROJECT_NAME OS_USER_DOMAIN_NAME OS_PROJECT_DOMAIN_NAME; do
            if [ -z "${!var}" ]; then
              echo "Missing required secret: $var"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

      - name: Configure OpenStack credentials
        env:
          OS_AUTH_URL: ${{ secrets.OS_AUTH_URL }}
          OS_USERNAME: ${{ secrets.OS_USERNAME }}
          OS_PASSWORD: ${{ secrets.OS_PASSWORD }}
          OS_PROJECT_NAME: ${{ secrets.OS_PROJECT_NAME }}
          OS_USER_DOMAIN_NAME: ${{ secrets.OS_USER_DOMAIN_NAME }}
          OS_PROJECT_DOMAIN_NAME: ${{ secrets.OS_PROJECT_DOMAIN_NAME }}
        run: |
          # Source the DevStack openrc file directly (since we're on the VM)
          source /opt/stack/devstack/openrc admin admin
          echo "OS_AUTH_URL=$OS_AUTH_URL" >> $GITHUB_ENV
          echo "OS_USERNAME=$OS_USERNAME" >> $GITHUB_ENV
          echo "OS_PROJECT_NAME=$OS_PROJECT_NAME" >> $GITHUB_ENV
          echo "OS_USER_DOMAIN_NAME=$OS_USER_DOMAIN_NAME" >> $GITHUB_ENV
          echo "OS_PROJECT_DOMAIN_NAME=$OS_PROJECT_DOMAIN_NAME" >> $GITHUB_ENV

      - name: Create cloud-init script
        run: |
          cat > cloud-init.yaml << 'EOF'
          #cloud-config
          package_update: true
          packages:
            - python3-pip
            - python3-dev
            - python3-venv
            - git
            - curl

          runcmd:
            # Create app directory
            - mkdir -p /opt/yolo-fastapi
            - cd /opt/yolo-fastapi
            
            # Copy app from GitHub (using raw URL)
            - curl -o /opt/yolo-fastapi/app.py https://raw.githubusercontent.com/${{ github.repository }}/main/app.py
            - curl -o /opt/yolo-fastapi/requirements.txt https://raw.githubusercontent.com/${{ github.repository }}/main/requirements.txt
            
            # Install dependencies
            - pip3 install --upgrade pip
            - pip3 install -r /opt/yolo-fastapi/requirements.txt
            - pip3 install ultralytics fastapi uvicorn python-multipart opencv-python numpy
            
            # Download YOLO model
            - python3 -c "from ultralytics import YOLO; YOLO('yolov8n.pt')"
            
            # Create systemd service
            - |
              cat > /etc/systemd/system/yolo-fastapi.service << 'SERVICEEOF'
              [Unit]
              Description=YOLOv8 FastAPI Service
              After=network.target

              [Service]
              Type=simple
              User=root
              WorkingDirectory=/opt/yolo-fastapi
              ExecStart=/usr/bin/python3 -m uvicorn app:app --host 0.0.0.0 --port 8080
              Restart=always
              RestartSec=10

              [Install]
              WantedBy=multi-user.target
              SERVICEEOF
            
            # Create mount points for volumes
            - mkdir -p /mnt/{logs,models,data}
            
            # Start service
            - systemctl daemon-reload
            - systemctl enable yolo-fastapi
            - systemctl start yolo-fastapi

          final_message: "YOLO FastAPI deployment complete"
          EOF

      - name: Create key pair if not exists
        run: |
          cd /opt/stack/devstack
          source openrc admin admin
          if ! openstack keypair list | grep -q "github-actions-key"; then
            echo "Creating github-actions-key..."
            openstack keypair create github-actions-key > /tmp/github-actions-key.pem
            chmod 600 /tmp/github-actions-key.pem
          else
            echo "Key already exists"
          fi

      - name: Deploy to OpenStack
        id: deploy
        run: |
          cd /opt/stack/devstack
          source openrc admin admin
          
          INSTANCE_NAME="yolo-fastapi-$(date +%Y%m%d-%H%M%S)"
          echo "instance_name=$INSTANCE_NAME" >> "$GITHUB_OUTPUT"

          echo "Launching instance: $INSTANCE_NAME"
          SERVER_ID=$(openstack server create \
            --flavor m1.small \
            --image ubuntu-22.04-base \
            --network yolo-private-network \
            --security-group yolo-sg \
            --key-name github-actions-key \
            --user-data $GITHUB_WORKSPACE/cloud-init.yaml \
            --wait \
            -f value -c id \
            "$INSTANCE_NAME")

          echo "Instance created with ID: $SERVER_ID"

          FLOATING_IP=$(openstack floating ip create public -f value -c floating_ip_address)
          openstack server add floating ip "$INSTANCE_NAME" "$FLOATING_IP"

          echo "floating_ip=$FLOATING_IP" >> "$GITHUB_OUTPUT"
          echo "FLOATING_IP=$FLOATING_IP" >> "$GITHUB_ENV"
          echo "INSTANCE_NAME=$INSTANCE_NAME" >> "$GITHUB_ENV"

          echo "Waiting 90 seconds for service to start..."
          sleep 90

      - name: Test deployment
        env:
          FLOATING_IP: ${{ steps.deploy.outputs.floating_ip }}
        run: |
          echo "Testing API at http://$FLOATING_IP:8080"
          
          # Test health endpoint
          curl -f "http://$FLOATING_IP:8080/health" || exit 1
          echo "✅ Health check passed"
          
          # Test root endpoint
          curl -f "http://$FLOATING_IP:8080/" || exit 1
          echo "✅ Root endpoint working"
          
          echo ""
          echo "✅ API is available at: http://$FLOATING_IP:8080"
          echo "✅ API docs at: http://$FLOATING_IP:8080/docs"

      - name: Run KPI measurements
        env:
          FLOATING_IP: ${{ steps.deploy.outputs.floating_ip }}
        run: |
          cd /opt/stack/devstack
          source openrc admin admin
          
          # Run the KPI script if it exists
          if [ -f "$GITHUB_WORKSPACE/measure_kpis.py" ]; then
            pip3 install -r "$GITHUB_WORKSPACE/requirements.txt"
            python3 "$GITHUB_WORKSPACE/measure_kpis.py" --endpoint "http://$FLOATING_IP:8080"
          else
            echo "No KPI script found"
          fi

      - name: Clean up on failure
        if: failure()
        run: |
          cd /opt/stack/devstack
          source openrc admin admin
          
          INSTANCE_NAME="${{ steps.deploy.outputs.instance_name }}"
          FLOATING_IP="${{ steps.deploy.outputs.floating_ip }}"
          
          echo "Deployment failed, cleaning up..."
          if [ -n "$INSTANCE_NAME" ] && openstack server show "$INSTANCE_NAME" &>/dev/null; then
            openstack server delete "$INSTANCE_NAME" || true
            echo "✅ Instance deleted"
          fi
          if [ -n "$FLOATING_IP" ] && openstack floating ip show "$FLOATING_IP" &>/dev/null; then
            openstack floating ip delete "$FLOATING_IP" || true
            echo "✅ Floating IP deleted"
          fi

  performance-test:
    name: Basic Performance Smoke Test
    needs: deploy-to-devstack
    if: needs.deploy-to-devstack.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Run performance smoke test
        env:
          API_URL: http://${{ needs.deploy-to-devstack.outputs.floating_ip }}:8080
        run: |
          echo "Running performance checks against $API_URL"
          
          # Test health endpoint performance
          echo "Testing health endpoint (10 requests)..."
          for i in {1..10}; do
            start=$(date +%s%N)
            code=$(curl -s -o /dev/null -w "%{http_code}" "$API_URL/health")
            end=$(date +%s%N)
            duration=$(( ($end - $start) / 1000000 ))
            echo "Request $i -> HTTP $code (${duration}ms)"
            if [ "$code" -ne 200 ]; then
              exit 1
            fi
          done
          
          echo "✅ All performance tests passed"